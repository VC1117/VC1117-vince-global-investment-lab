name: FCN large-cap HV and MDD integration (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hv-mdd-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2'
      - name: Validate volatility math
        run: python scripts/validate_fcn_volatility.py
      - name: Research HV20/30/60/90/180/252, MDD20/90, 90-day return
        run: python scripts/test_fcn_hv_largecap_integration.py
