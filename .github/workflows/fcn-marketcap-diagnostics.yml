name: FCN market-cap source diagnostics (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install 'yfinance>=0.2.65,<2'
      - name: Inspect market-cap API fields
        run: python scripts/diagnose_fcn_marketcap.py
