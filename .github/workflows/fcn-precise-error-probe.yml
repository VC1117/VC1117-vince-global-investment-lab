name: FCN precise failure probe (controlled research)
on:
  workflow_dispatch:
    inputs:
      diagnostics_run_id:
        description: "Successful PR24 diagnostics Actions run ID"
        required: true
        type: string
        default: "38138519566"
      probe_limit:
        description: "Maximum failed symbols to probe; start with 24"
        required: true
        type: choice
        default: "24"
        options:
          - "12"
          - "24"
          - "60"
          - "292"
permissions:
  contents: read
  actions: read
concurrency:
  group: fcn-precise-error-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify completed PR24 diagnostics source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.diagnostics_run_id }}
        with:
          script: |
            const raw=process.env.SOURCE_RUN.trim();
            if(!/^\d+$/.test(raw)) return core.setFailed('Invalid source run ID');
            const {owner,repo}=context.repo;
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(raw)})).data;
            if(run.path!=='.github/workflows/fcn-failure-diagnostics.yml' || run.status!=='completed' || run.conclusion!=='success')
              return core.setFailed('Source must be a completed successful PR24 diagnostics run');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
            if(!artifacts.some(a=>a.name==='fcn-failure-diagnostics' && !a.expired))
              return core.setFailed('Diagnostics artifact missing or expired');
            core.info('PROBE_DIAGNOSTICS_RUN='+run.id);
      - uses: actions/download-artifact@v4
        with:
          name: fcn-failure-diagnostics
          run-id: ${{ inputs.diagnostics_run_id }}
          github-token: ${{ github.token }}
          path: research/diagnostics
      - name: Offline self-test
        run: python scripts/test_fcn_error_probe.py
      - name: Install research-only data client
        run: python -m pip install 'yfinance>=0.2.65,<2'
      - name: Bounded probe (never stores cap values or raw exceptions)
        run: |
          python scripts/fcn_error_probe.py \
            --source-run "38137632572" \
            --limit "${{ inputs.probe_limit }}" \
            --pause 1.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcn-precise-error-probe
          path: research/error-probe/
          retention-days: 7
