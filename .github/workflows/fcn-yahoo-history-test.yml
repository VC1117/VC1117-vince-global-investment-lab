name: FCN Yahoo history research (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yahoo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only dependency
        run: python -m pip install 'yfinance>=0.2.65,<2'
      - name: Validate Yahoo NVDA history (no publication)
        run: python scripts/test_fcn_yahoo.py
