name: FCN failed-symbol diagnostics (offline research)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed FCN full screening run ID with snapshot and all 12 worker artifacts"
        required: true
        type: string
        default: "38137632572"
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source run and artifacts
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
        with:
          script: |
            const raw=process.env.SOURCE_RUN.trim();
            if(!/^\d+$/.test(raw)) return core.setFailed('source_run_id must be numeric');
            const {owner,repo}=context.repo;
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(raw)})).data;
            if(run.path!=='.github/workflows/fcn-automated-cap-screen.yml' || run.status!=='completed' || run.conclusion!=='success')
              return core.setFailed('Source must be a successful completed FCN screening run');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
            const names=new Set(artifacts.filter(a=>!a.expired).map(a=>a.name));
            const required=['fcn-pr17-snapshot',...Array.from({length:12},(_,i)=>'fcn-pr17-worker-'+i)];
            if(required.some(n=>!names.has(n))) return core.setFailed('Missing or expired full-run artifacts');
            core.info('DIAGNOSTIC_SOURCE_RUN='+run.id+' WORKERS=12');
      - uses: actions/download-artifact@v4
        with:
          name: fcn-pr17-snapshot
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: research
      - uses: actions/download-artifact@v4
        with:
          pattern: fcn-pr17-worker-*
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: research/results
          merge-multiple: true
      - name: Offline regression tests
        run: python scripts/test_fcn_failure_diagnostics.py
      - name: Diagnose saved failure statuses without any market API calls
        run: python scripts/fcn_failure_diagnostics.py --source-run "${{ inputs.source_run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fcn-failure-diagnostics
          path: research/diagnostics/
          retention-days: 7
