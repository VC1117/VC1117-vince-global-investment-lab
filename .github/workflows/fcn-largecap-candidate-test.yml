name: FCN large-cap candidate pilot (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependency
        run: python -m pip install 'yfinance>=0.2.65,<2'
      - name: Screen candidate capitalization and validate HV
        run: python scripts/test_fcn_largecap_candidates.py
