name: FCN automated market-cap screening (manual research)
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Required only in manual_resume mode; ignored otherwise"
        type: string
        required: false
        default: ""
      run_mode:
        description: "auto_resume = find previous successful artifacts; manual_resume = exact run ID; fresh = explicit new snapshot"
        type: choice
        required: true
        default: auto_resume
        options:
          - auto_resume
          - manual_resume
          - fresh
      scope:
        description: "pilot=first 2 batches only; full=all provisional candidates, may be rate limited"
        type: choice
        required: true
        default: pilot
        options:
          - pilot
          - full
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.configure.outputs.matrix }}
      workers: ${{ steps.configure.outputs.workers }}
      source_run: ${{ steps.resolve.outputs.source_run }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline research brief regression test
        run: python scripts/test_fcn_morning_research_brief.py
      - name: Offline runner regression test
        run: python scripts/test_fcn_cap_batch_runner.py
      - name: Resolve prior successful artifacts (fail closed)
        id: resolve
        uses: actions/github-script@v7
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          MANUAL_ID: ${{ inputs.resume_run_id }}
          SCOPE: ${{ inputs.scope }}
        with:
          script: |
            const mode=process.env.RUN_MODE;
            const manual=process.env.MANUAL_ID.trim();
            const scope=process.env.SCOPE;
            const {owner,repo}=context.repo;
            if(!['auto_resume','manual_resume','fresh'].includes(mode)) core.setFailed('Invalid run mode');
            if(mode==='fresh'){
              if(manual) return core.setFailed('Fresh mode forbids resume_run_id');
              core.setOutput('mode','fresh');core.setOutput('source_run','');
              core.info('RESUME_MODE=fresh (explicit)');
              return;
            }
            if(mode==='auto_resume' && manual) return core.setFailed('Auto mode forbids manual ID');
            if(mode==='manual_resume' && !/^\\d+$/.test(manual)) return core.setFailed('Manual mode requires numeric resume_run_id');
            const valid=async run=>{
              if(run.id===context.runId || run.status!=='completed'||run.conclusion!=='success') return false;
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
              const names=new Set(artifacts.filter(a=>!a.expired).map(a=>a.name));
              return names.has('fcn-pr17-snapshot') && names.has('fcn-pr17-worker-0') && names.has('fcn-pr17-worker-1');
            };
            let chosen;
            if(mode==='manual_resume'){
              const response=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(manual)});
              if(response.data.path!=='.github/workflows/fcn-automated-cap-screen.yml' || !(await valid(response.data))) return core.setFailed('Source run invalid, failed or artifacts expired');
              chosen=response.data;
            } else {
              const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{owner,repo,workflow_id:'fcn-automated-cap-screen.yml',status:'completed',per_page:100});
              for(const run of runs){
                if(run.conclusion==='success' && await valid(run)){chosen=run;break;}
              }
              if(!chosen) return core.setFailed('No resumable successful run with unexpired artifacts. Choose fresh explicitly.');
            }
            // Pilot/full transitions require explicit review before broad execution.
            core.setOutput('mode','restore');
            core.setOutput('source_run',String(chosen.id));
            core.info('RESUME_MODE=restore SOURCE_RUN='+chosen.id+' SCOPE='+scope);
      - name: Restore frozen snapshot for resume
        if: steps.resolve.outputs.mode == 'restore'
        uses: actions/download-artifact@v4
        with:
          name: fcn-pr17-snapshot
          run-id: ${{ steps.resolve.outputs.source_run }}
          github-token: ${{ github.token }}
          path: research
      - name: Offline resume regression test
        run: python scripts/test_fcn_resume.py
      - name: Freeze provisional universe
        if: steps.resolve.outputs.mode == 'fresh'
        run: python scripts/fcn_snapshot_batch_pipeline.py snapshot
      - name: Generate full coverage plan
        if: steps.resolve.outputs.mode == 'fresh'
        run: python scripts/fcn_universe_coverage.py plan --size 20
      - name: Validate resumed manifest
        if: steps.resolve.outputs.mode == 'restore'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from fcn_universe_coverage import audit
          audit(Path('research/snapshot.json'), Path('research/coverage-plan.json'), Path('research/no-batches'), Path('research/preflight.json'))
          PY
      - id: configure
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          manifest=Path("research/coverage-plan.json")
          data=json.loads(manifest.read_text())
          if os.environ["SCOPE"]=="pilot":
              # Preserve all shards in the immutable coverage manifest.
              # The runner limits execution to the first two shards separately.
              workers=2
          else:
              workers=12
          matrix={"include":[{"worker":i} for i in range(workers)]}
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(matrix,separators=(",",":"))+"\n")
              f.write("workers="+str(workers)+"\n")
          print("MODE",os.environ["SCOPE"],"PLANNED_SHARDS",len(data["shards"]),"WORKERS",workers)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcn-pr17-snapshot
          path: |
            research/snapshot.json
            research/coverage-plan.json
          retention-days: 7
  screen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fcn-pr17-snapshot
          path: research
      - name: Restore prior worker results
        if: needs.prepare.outputs.mode == 'restore'
        uses: actions/download-artifact@v4
        with:
          pattern: fcn-pr17-worker-*
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: research/results
          merge-multiple: true
      - name: Install unofficial research-only interface
        run: python -m pip install 'yfinance>=0.2.65,<2'
      - name: Screen assigned shards with bounded retry
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$SCOPE" = "pilot" ]; then
            python scripts/fcn_cap_batch_runner.py --worker ${{ matrix.worker }} --workers ${{ needs.prepare.outputs.workers }} --limit-shards 2 --retry-failed
          else
            python scripts/fcn_cap_batch_runner.py --worker ${{ matrix.worker }} --workers ${{ needs.prepare.outputs.workers }} --retry-failed
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcn-pr17-worker-${{ matrix.worker }}
          path: research/results/batch_*.json
          if-no-files-found: warn
          retention-days: 7
  audit:
    needs: [prepare,screen]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fcn-pr17-snapshot
          path: research
      - uses: actions/download-artifact@v4
        with:
          pattern: fcn-pr17-worker-*
          path: research/results
          merge-multiple: true
      - name: Audit coverage and unresolved symbols
        run: python scripts/fcn_universe_coverage.py audit
      - name: Generate audited internal research brief
        if: needs.screen.result == 'success'
        env:
          RUN_ID: ${{ github.run_id }}
          SCOPE: ${{ inputs.scope }}
        run: python scripts/fcn_morning_research_brief.py --run-id "$RUN_ID" --scope "$SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcn-pr17-coverage-audit
          path: |
            research/coverage-summary.json
            research/FCN_MORNING_RESEARCH_BRIEF.md
          if-no-files-found: warn
          retention-days: 7
